{% extends "base.html" %}

{% block title %}404 - Page Not Found - CyberGuard{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="cyber-card p-5">
        <div class="display-1 fw-bold text-info mb-2">404</div>
        <i class="bi bi-shield-x text-danger display-4 mb-3 d-block"></i>
        <h3 class="text-light fw-bold mb-2">Access Boundary Exceeded</h3>
        <p class="text-muted mb-4">The requested security resource or endpoint could not be found or has been restricted.</p>
        <a href="{{ url_for('index') }}" class="btn btn-cyber-primary">
          <i class="bi bi-house-door me-1"></i> Return to Safe Harbor
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
